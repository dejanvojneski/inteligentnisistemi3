<!DOCTYPE html>
<html lang="mk">
<head>
    <meta charset="UTF-8">
    <title>Fake News Detector 🚀</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f0f2f5; padding-top: 50px; }
        .card { max-width: 700px; margin: auto; border-radius: 15px; }
        .btn-primary { background-color: #6f42c1; border: none; transition: 0.3s; }
        .btn-primary:hover { background-color: #5a32a3; transform: translateY(-2px); }
        .btn-outline-secondary { transition: 0.3s; }
        #chat-box { min-height: 300px; max-height: 480px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; padding: 10px 0; }
        .message { max-width: 85%; padding: 10px 14px; border-radius: 12px; font-size: 14px; line-height: 1.6; }
        .message.user { background-color: #6f42c1; color: white; align-self: flex-end; border-bottom-right-radius: 4px; }
        .message.bot { background-color: #f8fafc; color: #2d3748; align-self: flex-start; border-bottom-left-radius: 4px; border-left: 5px solid #6f42c1; }
        .message.fake { border-left: 5px solid #e53e3e; background-color: #fff0f0; }
        .message.real { border-left: 5px solid #38a169; background-color: #f0fff4; }
        .message.loading { color: #999; font-style: italic; border-left: 5px solid #ccc; }
        .bot-label { font-weight: bold; font-size: 1.2rem; margin-bottom: 4px; }
        .bot-conf { font-size: 12px; color: #0d6efd; font-weight: 600; margin-bottom: 6px; }
        .bot-reason { font-style: italic; color: #4a5568; background: white; padding: 10px; border-radius: 8px; font-size: 13px; }
        .empty-state { text-align: center; color: #bbb; font-size: 14px; margin: auto; padding: 40px 0; }
        #input-area { display: flex; gap: 8px; margin-top: 16px; }
        #user-input { flex: 1; border-radius: 10px; padding: 10px 14px; border: 1px solid #ddd; font-size: 14px; resize: none; }
        #user-input:focus { outline: none; border-color: #6f42c1; box-shadow: 0 0 0 3px rgba(111,66,193,0.15); }
        #send-btn { padding: 10px 20px; border-radius: 10px; font-size: 14px; white-space: nowrap; }
        #send-btn:disabled { opacity: 0.6; cursor: not-allowed; }
    </style>
</head>
<body>
<div class="container">
    <div class="card p-5 shadow-lg">
        <h2 class="mb-2 text-center">🧠 AI Lie Detector</h2>
        <p class="text-muted text-center mb-4">Внесете го целиот текст на веста или само директниот линк (URL) за анализа.</p>

        <div id="chat-box">
            <div class="empty-state" id="empty-msg">Сè уште нема пораки. Внеси нешто подолу!</div>
        </div>

        <div id="input-area">
            <textarea id="user-input" rows="2" placeholder="Залепи го текстот или линкот тука..."></textarea>
            <button id="send-btn" class="btn btn-primary shadow" onclick="sendMessage()">Анализирај 🚀</button>
        </div>

        <div class="text-end mt-2">
            <button class="btn btn-sm btn-outline-secondary" onclick="clearChat()">Избриши историја</button>
        </div>
    </div>
</div>

<script>
    const chatBox = document.getElementById("chat-box");
    const input = document.getElementById("user-input");
    const sendBtn = document.getElementById("send-btn");

    function removeEmpty() {
        const empty = document.getElementById("empty-msg");
        if (empty) empty.remove();
    }

    function scrollDown() { chatBox.scrollTop = chatBox.scrollHeight; }

    function escapeHtml(text) {
        return text.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
    }

    function appendMessage(role, html, extraClass = "") {
        removeEmpty();
        const div = document.createElement("div");
        div.className = `message ${role} ${extraClass}`.trim();
        div.innerHTML = html;
        chatBox.appendChild(div);
        scrollDown();
        return div;
    }

    async function sendMessage() {
        const text = input.value.trim();
        if (!text) return;
        input.value = "";
        sendBtn.disabled = true;
        appendMessage("user", escapeHtml(text));
        const loadingEl = appendMessage("bot", "⏳ Проверувам...", "loading");
        try {
            const res = await fetch("/chat", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ message: text })
            });
            const data = await res.json();
            loadingEl.remove();
            if (data.error) {
                appendMessage("bot", `⚠️ ${escapeHtml(data.error)}`);
            } else {
                const cls = data.label === "FAKE" ? "fake" : "real";
                appendMessage("bot", `
                    <div class="bot-label">${escapeHtml(data.status)}</div>
                    <div class="bot-conf">AI сигурност: ${data.ai_conf}% | ML сигурност: ${data.ml_conf}%</div>
                    <div class="bot-reason"><strong>🤖 Објаснување од AI:</strong><br>${escapeHtml(data.reason)}</div>
                `, cls);
            }
        } catch (err) {
            loadingEl.remove();
            appendMessage("bot", "⚠️ Грешка при поврзување со серверот.");
        }
        sendBtn.disabled = false;
        input.focus();
    }

    async function clearChat() {
        await fetch("/clear", { method: "POST" });
        chatBox.innerHTML = `<div class="empty-state" id="empty-msg">Сè уште нема пораки. Внеси нешто подолу!</div>`;
    }

    input.addEventListener("keydown", e => {
        if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendMessage(); }
    });
</script>
</body>
</html>
